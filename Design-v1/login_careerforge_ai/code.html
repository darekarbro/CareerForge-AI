        .gradient-mesh {
            background: radial-gradient(circle at 15% 50%, rgba(255, 107, 53, 0.05) 0%, transparent 40%),

<body class="bg-base text-text-primary antialiased min-h-screen flex items-center justify-center gradient-mesh relative overflow-hidden px-margin-mobile md:px-margin-desktop">
<main class="w-full max-w-[400px] z-10 flex flex-col items-center">
<!-- Logo -->
<div class="mb-xl flex flex-col items-center">
<div class="w-[80px] h-[80px] bg-surface rounded-lg border border-border-subtle flex items-center justify-center mb-md overflow-hidden">
<img alt="CareerForge AI Logo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDUUQ-ShU_cO8ljIQYIQ9TLOgtQgiUUETMk-VZDCX_-mMf4KrrMm4nvVa1jHfjpMZj7LaX9JvGsC9RDYYEnrjVXeFYaFtKCPnKVjtKueI2lwUwn5w0-9ETVWigixjkWr20CeTKtB0SqE-Dc5uW_a3gKK55lqFTtWNr6JTQSv4isGxxJGVoB9Rh3zjNMwnpDbzx5gPEkMcTsdCEfWmlZHMUcBKpxoJov4j6Zx-yD5Nwne14L_dwc8zQi"/>
</div>
<h1 class="font-headline-lg text-headline-lg text-text-primary tracking-tight">CareerForge AI</h1>
<p class="font-mono-readout text-mono-readout text-text-secondary mt-xs">v2.4.1 // INITIALIZING</p>
</div>
<!-- Login Card -->
<div class="w-full bg-surface border border-border-subtle rounded-lg p-xl flex flex-col">
<h2 class="font-headline-md text-headline-md text-text-primary mb-lg">Welcome back</h2>
<form class="flex flex-col gap-lg w-full">
<!-- Email Field -->
<div class="flex flex-col gap-sm">
<label class="font-label-caps text-label-caps text-text-secondary uppercase" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-text-muted text-[20px]">mail</span>
<input class="w-full bg-surface-raised border border-border-subtle rounded text-text-primary font-body-md text-body-md py-md pl-[44px] pr-md focus:border-accent-steel focus:ring-1 focus:ring-accent-steel focus:outline-none transition-colors" id="email" placeholder="operator@system.io" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-sm">
<div class="flex justify-between items-baseline">
<label class="font-label-caps text-label-caps text-text-secondary uppercase" for="password">Password</label>
<a class="font-body-sm text-body-sm text-accent-steel hover:text-accent-steel-muted transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-text-muted text-[20px]">lock</span>
<input class="w-full bg-surface-raised border border-border-subtle rounded text-text-primary font-body-md text-body-md py-md pl-[44px] pr-[44px] focus:border-accent-steel focus:ring-1 focus:ring-accent-steel focus:outline-none transition-colors" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-text-muted hover:text-text-primary transition-colors focus:outline-none" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="visibilityIcon">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-accent-ember hover:bg-accent-ember-hover text-surface-container-highest font-headline-sm text-headline-sm py-md rounded transition-all duration-160 mt-sm flex items-center justify-center gap-sm active:scale-[0.98]" type="submit">
<span>Authenticate</span>
<span class="material-symbols-outlined text-[20px]">login</span>
</button>
</form>
</div>
<!-- Footer Link -->
<div class="mt-lg font-body-md text-body-md text-text-secondary">
            Don't have an account? <a class="text-accent-ember hover:text-accent-ember-hover transition-colors font-medium" href="#">Request Access</a>
</div>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const togglePassword = document.getElementById('togglePassword');
            const passwordField = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibilityIcon');

            togglePassword.addEventListener('click', () => {
                const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordField.setAttribute('type', type);
                
                visibilityIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
            });
        });
    </script>
</body></html>
