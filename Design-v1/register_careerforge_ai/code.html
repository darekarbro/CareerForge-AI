<!DOCTYPE html><html class="dark" lang="en"><head>

<style>
        .glow-focus:focus-within {
            box-shadow: 0 0 0 1px theme('colors.accent-steel');
            border-color: theme('colors.accent-steel');
        }
        .bg-pattern {
            background-image: radial-gradient(theme('colors.border-subtle') 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="bg-base text-text-primary min-h-screen flex items-center justify-center relative bg-pattern overflow-hidden p-margin-mobile md:p-margin-desktop font-body-md">
<!-- Decorative background elements -->
<div class="absolute top-0 left-1/4 w-96 h-96 bg-accent-ember/5 rounded-full blur-[120px] pointer-events-none"></div>
<div class="absolute bottom-0 right-1/4 w-96 h-96 bg-accent-steel/5 rounded-full blur-[120px] pointer-events-none"></div>
<main class="w-full max-w-[400px] z-10">
<!-- Logo -->
<div class="text-center mb-lg">
<h1 class="font-headline-lg text-headline-lg font-bold text-accent-ember flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">terminal</span>
                CareerForge AI
            </h1>
<p class="font-body-sm text-body-sm text-text-secondary mt-xs">Technical Console Access</p>
</div>
<!-- Registration Card -->
<div class="bg-surface border border-border-subtle rounded-lg p-lg md:p-xl shadow-2xl relative overflow-hidden">
<!-- Top highlight line -->
<div class="absolute top-0 left-0 w-full h-[2px] bg-gradient-to-r from-accent-ember to-accent-steel"></div>
<h2 class="font-headline-md text-headline-md mb-lg">Initialize Profile</h2>
<form class="flex flex-col gap-md">
<!-- Name Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-text-secondary uppercase" for="name">Full Name</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-text-muted group-focus-within:text-accent-steel transition-colors">person</span>
<input class="w-full bg-surface-raised border border-border-subtle rounded-DEFAULT py-sm pl-[36px] pr-sm text-text-primary font-mono-readout text-mono-readout focus:outline-none focus:ring-0 glow-focus transition-all placeholder:text-text-muted" id="name" name="name" placeholder="John Doe" required="" type="text">
</div>
</div>
<!-- Email Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-text-secondary uppercase" for="email">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-text-muted group-focus-within:text-accent-steel transition-colors">mail</span>
<input class="w-full bg-surface-raised border border-border-subtle rounded-DEFAULT py-sm pl-[36px] pr-sm text-text-primary font-mono-readout text-mono-readout focus:outline-none focus:ring-0 glow-focus transition-all placeholder:text-text-muted" id="email" name="email" placeholder="j.doe@example.com" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-text-secondary uppercase" for="password">Secure Password</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-text-muted group-focus-within:text-accent-steel transition-colors">lock</span>
<input class="w-full bg-surface-raised border border-border-subtle rounded-DEFAULT py-sm pl-[36px] pr-[36px] text-text-primary font-mono-readout text-mono-readout focus:outline-none focus:ring-0 glow-focus transition-all placeholder:text-text-muted" id="password" name="password" placeholder="••••••••" required="" type="password">
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-text-muted hover:text-text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[18px]">visibility</span>
</button>
</div>
<!-- Password Strength Meter -->
<div class="mt-xs">
<div class="flex gap-1 h-[4px] w-full rounded-full overflow-hidden">
<div class="h-full flex-1 bg-error"></div>
<div class="h-full flex-1 bg-warning"></div>
<div class="h-full flex-1 bg-success opacity-20"></div>
<div class="h-full flex-1 bg-border-strong"></div>
</div>
<p class="font-body-sm text-body-sm text-warning mt-1 text-right">Moderate</p>
</div>
</div>
<!-- Confirm Password Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-text-secondary uppercase" for="confirm-password">Confirm Password</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-text-muted group-focus-within:text-accent-steel transition-colors">lock_reset</span>
<input class="w-full bg-surface-raised border border-border-subtle rounded-DEFAULT py-sm pl-[36px] pr-sm text-text-primary font-mono-readout text-mono-readout focus:outline-none focus:ring-0 glow-focus transition-all placeholder:text-text-muted" id="confirm-password" name="confirm-password" placeholder="••••••••" required="" type="password">
</div>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start gap-sm mt-xs">
<div class="flex items-center h-5">
<input class="w-4 h-4 rounded-sm border-border-subtle bg-surface-raised text-accent-steel focus:ring-accent-steel focus:ring-offset-surface" id="terms" type="checkbox">
</div>
<label class="font-body-sm text-body-sm text-text-secondary" for="terms">
                        I agree to the <a class="text-accent-steel hover:text-accent-ember transition-colors underline decoration-border-subtle underline-offset-2" href="#">Terms of Service</a> and <a class="text-accent-steel hover:text-accent-ember transition-colors underline decoration-border-subtle underline-offset-2" href="#">Privacy Policy</a>.
                    </label>
</div>
<!-- Actions -->
<div class="mt-md">
<button class="w-full bg-accent-ember hover:bg-accent-ember-hover text-surface-dim font-headline-sm text-headline-sm py-sm px-lg rounded-DEFAULT transition-all duration-160 flex justify-center items-center gap-2 active:scale-[0.98]" type="submit">
                        Execute Registration
                        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</form>
<div class="mt-lg pt-lg border-t border-border-subtle text-center">
<p class="font-body-sm text-body-sm text-text-secondary">
                    System access already verified? 
                    <a class="text-accent-ember hover:text-accent-steel font-medium transition-colors ml-1" href="#">Authenticate here</a>
</p>
</div>
</div>
</main>
</body></html>
