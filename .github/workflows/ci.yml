name: Project checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_BUILD_WORKERS: 1
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
      NEXT_PUBLIC_SOCKET_URL: http://localhost:5000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client
      - run: npm test
        working-directory: server
      - run: npm test
        working-directory: client
      - run: npm run lint
        working-directory: client
      - run: npm run build
        working-directory: client
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - run: npm run test:browser
        working-directory: client
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: .test-tmp/browser-*
          if-no-files-found: ignore
          retention-days: 7
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/setupLocal.cjs
      - run: docker compose --env-file .env.compose config --quiet
      - run: docker compose --env-file .env.compose up --build -d --wait --wait-timeout 180
      - run: node scripts/testCompose.cjs
      - name: Collect container diagnostics
        if: failure()
        run: docker compose --env-file .env.compose logs --no-color --tail 150 > compose-failure.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: container-diagnostics
          path: compose-failure.log
          retention-days: 7
      - run: docker compose --env-file .env.compose down
        if: always()
