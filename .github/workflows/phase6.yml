name: Phase 6 engineering evidence
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  operational-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - run: npm ci
        working-directory: server
      - run: npm run evidence:phase6
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: phase6-operational-evidence
          path: .test-tmp/phase6-evidence.json
          include-hidden-files: true
          retention-days: 7
  container-faults:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - run: node scripts/setupLocal.cjs
      - run: npm run test:phase6:containers
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: phase6-container-evidence
          path: .test-tmp/phase6-containers.json
          include-hidden-files: true
          retention-days: 7
